name: Watchlist and Docker checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: docker build -t multiboxd:test .
      - name: Validate Compose configuration
        run: |
          printf 'TMDB_API_KEY=test-only-key\n' > .env.local
          docker compose config --quiet
      - name: Test production HTTP routes in Docker with fixture upstreams
        run: |
          docker run -d --name multiboxd-test -p 127.0.0.1:3000:3000 \
            -e TMDB_API_KEY=test-only-key \
            -e NODE_OPTIONS=--require=/fixtures/upstreams.cjs \
            -v "$PWD/tests:/fixtures:ro" multiboxd:test
          node tests/smoke.mjs
      - if: always()
        run: |
          docker logs multiboxd-test || true
          docker rm -f multiboxd-test || true
